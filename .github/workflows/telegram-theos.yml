name: TeleBotHost Theos Compiler

on:
  workflow_dispatch:
    inputs:
      telegram_file_id:
        description: Telegram file_id for the uploaded ZIP
        required: true
        type: string
      chat_id:
        description: Telegram chat ID to receive the result
        required: true
        type: string
      requester_id:
        description: Telegram user ID authorized to compile
        required: true
        type: string
      filename:
        description: Original ZIP filename
        required: true
        type: string

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bot dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Download and compile project, then send result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          INPUT_TELEGRAM_FILE_ID: ${{ inputs.telegram_file_id }}
          INPUT_CHAT_ID: ${{ inputs.chat_id }}
          INPUT_REQUESTER_ID: ${{ inputs.requester_id }}
          INPUT_FILENAME: ${{ inputs.filename }}
        run: python scripts/telegram_compiler.py
